<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06281e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <rect width="900" height="210" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="210" rx="12" fill="url(#grid)" />

  <!-- Terminal Top Bar -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.85" />
  <circle cx="46" cy="24" r="5" fill="#f59e0b" opacity="0.85" />
  <circle cx="64" cy="24" r="5" fill="#10b981" opacity="0.85" />
  <text x="86" y="28" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">mehedi@systems:~/production-ai</text>

