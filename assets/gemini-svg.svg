  <text x="450" y="106" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Mehedi Hasan</text>
  <text x="450" y="142" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
    AI Systems Engineer  ·  <tspan fill="#10b981" font-weight="600">RAG & Agentic Architect</tspan>  ·  Backend & MLOps
  </text>
  <text x="450" y="174" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    vLLM Quantized Serving  |  Calibrated Hybrid RAG  |  LangGraph  |  CI Regression Gates
