  <rect x="698" y="13" width="178" height="24" rx="12" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="1" />
  <circle cx="714" cy="25" r="4" fill="#10b981" />
  <text x="726" y="29" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">OPEN TO ROLES · UTC+6</text>

